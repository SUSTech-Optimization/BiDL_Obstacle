[project]
name = "obstacle-control-bilevel-code"
version = "0.1.0"
description = "Code for a single-loop bilevel deep learning method for optimal control of obstacle problems"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.11.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "tqdm==4.67.3",
    "ipython==8.39.0",
]

[dependency-groups]
notebook = [
    "jupyterlab==4.6.4",
    "ipykernel==7.3.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
